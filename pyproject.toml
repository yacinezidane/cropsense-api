[project]
name = "api"
version = "0.1.0"
description = "Plant Disease Detection API - Flask REST API with MongoDB"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "pymongo>=4.10.1",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.0",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "pillow>=12.0.0",
    "gunicorn>=23.0.0",  # Production WSGI server
    "flasgger>=0.9.7.1",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "flask-sock>=0.7.0",
    "huggingface-hub>=1.18.0",
]

[project.scripts]
api = "api.app:main"
